name: storyworld
services:
  deps:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    command: npm ci --no-audit --no-fund
    volumes:
      - .:/workspace
      - storyworld_node_modules:/workspace/node_modules
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    command: npm run dev --workspace=@storyworld/api
    volumes:
      - .:/workspace
      - storyworld_node_modules:/workspace/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      deps:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 2s
      retries: 30
    init: true
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    command: npm run dev --workspace=@storyworld/web
    volumes:
      - .:/workspace
      - storyworld_node_modules:/workspace/node_modules
    environment:
      API_PROXY_TARGET: http://api:3001
      VITE_WORLD_MODE: ${VITE_WORLD_MODE:-fixture}
      VITE_SPACETIMEDB_URI: ${VITE_SPACETIMEDB_URI:-https://maincloud.spacetimedb.com}
      VITE_SPACETIMEDB_DATABASE: ${VITE_SPACETIMEDB_DATABASE:-storyworld-zhvbk}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 2s
      retries: 30
    init: true
volumes:
  storyworld_node_modules:
